name: Pruebas
on:
  push: { branches: [main] }
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: prueba, POSTGRES_DB: prueba }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install radicale==3.9.1
      - run: |
          mkdir -p /tmp/rad && printf '[server]\nhosts = 127.0.0.1:5232\n[auth]\ntype = none\n[storage]\nfilesystem_folder = /tmp/rad/col\n[rights]\ntype = owner_only\n' > /tmp/rad/config
          nohup python -m radicale --config /tmp/rad/config > /tmp/rad/log 2>&1 &
          sleep 2
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:prueba@localhost:5432/prueba
          RADICALE_URL: http://127.0.0.1:5232/
