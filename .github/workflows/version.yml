# Al crear una etiqueta vX.Y.Z: publica la imagen en ghcr.io (amd64 + arm64)
# y adjunta compose.yaml, example.env e instalar.sh a la versión en GitHub Releases.
name: Versión
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veredicto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            compose.yaml
            example.env
            scripts/instalar.sh
            scripts/restaurar.sh
